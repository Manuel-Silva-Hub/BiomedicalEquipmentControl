<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital BIOMED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

            /* Efectos de fondo animados */
            body::before {
                content: "";
                position: absolute;
                width: 500px;
                height: 500px;
                background: radial-gradient(circle, rgba(86, 165, 255, 0.1) 0%, transparent 70%);
                border-radius: 50%;
                top: -250px;
                right: -250px;
                animation: float 8s ease-in-out infinite;
            }

            body::after {
                content: "";
                position: absolute;
                width: 400px;
                height: 400px;
                background: radial-gradient(circle, rgba(86, 165, 255, 0.08) 0%, transparent 70%);
                border-radius: 50%;
                bottom: -200px;
                left: -200px;
                animation: float 10s ease-in-out infinite reverse;
            }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(20, 25, 45, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(86, 165, 255, 0.1);
            width: 420px;
            max-width: 90%;
            border: 1px solid rgba(86, 165, 255, 0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #56a5ff 0%, #3d7dc7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 35px;
            box-shadow: 0 8px 20px rgba(86, 165, 255, 0.3);
        }

        h2 {
            color: #fff;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #8b9dc3;
            text-align: center;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            color: #8b9dc3;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 20, 40, 0.6);
            border: 1.5px solid rgba(86, 165, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

            input:focus {
                border-color: #56a5ff;
                background: rgba(15, 20, 40, 0.8);
                box-shadow: 0 0 20px rgba(86, 165, 255, 0.2);
            }

            input::placeholder {
                color: #5a6b8a;
            }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #56a5ff 0%, #3d7dc7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(86, 165, 255, 0.3);
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 30px rgba(86, 165, 255, 0.4);
                background: linear-gradient(135deg, #6bb5ff 0%, #4d8dd7 100%);
            }

            button:active {
                transform: translateY(0);
            }

        #msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .error {
            background: rgba(217, 83, 79, 0.2);
            border: 1px solid rgba(217, 83, 79, 0.4);
            color: #ff6b6b;
        }

        .info {
            background: rgba(86, 165, 255, 0.2);
            border: 1px solid rgba(86, 165, 255, 0.4);
            color: #56a5ff;
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            color: #8b9dc3;
            font-size: 13px;
        }

            .footer-link a {
                color: #56a5ff;
                text-decoration: none;
                transition: color 0.3s;
            }

                .footer-link a:hover {
                    color: #6bb5ff;
                }

        /* Loading spinner */
        .loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        button.loading .spinner {
            display: block;
        }

        button.loading .btn-text {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <h2>Hospital BIOMED</h2>
            <p class="subtitle">Sistema de Control de Equipos</p>
        </div>

        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input id="email" type="email" placeholder="correo@hospital.com" autocomplete="email">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button onclick="login()" id="loginBtn">
            <span class="btn-text">Iniciar Sesión</span>
            <div class="spinner"></div>
        </button>

        <p id="msg"></p>

        <div class="footer-link">
            <a href="index.html">← Volver al inicio</a>
        </div>
    </div>

    <script>
        // Permitir login con Enter
        document.getElementById("password").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                login();
            }
        });

        document.getElementById("email").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                document.getElementById("password").focus();
            }
        });

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const msgElement = document.getElementById("msg");
            const loginBtn = document.getElementById("loginBtn");

            // Validación básica
            if (!email || !password) {
                showMessage("Por favor completa todos los campos", "error");
                return;
            }

            // Mostrar loading
            loginBtn.classList.add("loading");
            msgElement.style.display = "none";

            try {
                console.log("🔄 Intentando login...");

                const response = await fetch("http://localhost:8000/auth/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                loginBtn.classList.remove("loading");

                if (!response.ok) {
                    const error = await response.json();
                    showMessage("Error: " + (error.message || "Credenciales incorrectas"), "error");
                    return;
                }

                const data = await response.json();
                console.log("✅ DATA LOGIN:", data);

                // Extraer token
                const realToken = data.token?.token || data.token;

                if (!realToken || typeof realToken !== 'string') {
                    showMessage("Error: No se recibió un token válido", "error");
                    return;
                }

                console.log("🔑 TOKEN GUARDADO:", realToken);
                localStorage.setItem("jwt", realToken);

                showMessage("✓ Login exitoso, redirigiendo...", "info");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (err) {
                loginBtn.classList.remove("loading");
                console.error("❌ Error:", err);
                showMessage("No se pudo conectar con el servidor", "error");
            }
        }

        function showMessage(text, type) {
            const msgElement = document.getElementById("msg");
            msgElement.textContent = text;
            msgElement.className = type;
            msgElement.style.display = "block";
        }
    </script>
</body>
</html>
