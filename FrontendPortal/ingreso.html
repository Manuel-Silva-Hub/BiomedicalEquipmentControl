<!DOCTYPE html>
<html>
<body>

    <h2>Registrar Ingreso</h2>

    <input id="tipo" placeholder="Tipo de equipo"><br>
    <input id="serial" placeholder="Serial"><br>
    <input id="usuario" placeholder="Usuario que registra"><br>
    <button onclick="ingresar()">Enviar</button>

    <p id="msg"></p>

    <script>
async function ingresar() {
    const token = localStorage.getItem("token");

    const body = {
        EquipmentType: tipo.value,
        Serial: serial.value,
        EntryUser: usuario.value
    };

    const res = await fetch("http://localhost:4000/api/registro/ingreso", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify(body)
    });

    if (!res.ok) {
        msg.textContent = "Error al registrar.";
        msg.style.color = "red";
        return;
    }

    msg.textContent = "Ingreso registrado.";
    msg.style.color = "green";
}
    </script>

</body>
</html>
