<!DOCTYPE html>
<html>
<body>

    <h1>Inventario</h1>

    <button onclick="cargar()">Cargar Inventario</button>

    <ul id="lista"></ul>

    <script>
async function cargar() {
    const res = await fetch("http://localhost:4000/api/equipos");
    const data = await res.json();

    lista.innerHTML = "";

    data.forEach(e => {
        const li = document.createElement("li");
        li.innerHTML = `
            ${e.equipmentType} - ${e.serial}
            <button onclick="editar(${e.id})">Editar</button>
            <button onclick="eliminar(${e.id})">Eliminar</button>
        `;
        lista.appendChild(li);
    });
}

async function eliminar(id) {
    const token = localStorage.getItem("token");

    await fetch("http://localhost:4000/api/equipos/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
    });

    cargar();
}
    </script>

</body>
</html>
