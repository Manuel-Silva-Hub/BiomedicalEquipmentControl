<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hospital BIOMED</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: rgba(20, 25, 45, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(86, 165, 255, 0.2);
            z-index: 100;
        }

        .sidebar-header {
            padding: 0 25px 30px;
            border-bottom: 1px solid rgba(86, 165, 255, 0.2);
        }

        .sidebar h2 {
            text-align: center;
            color: #56a5ff;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 600;
        }

        .sidebar-subtitle {
            text-align: center;
            color: #8b9dc3;
            font-size: 12px;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 14px 25px;
            color: #8b9dc3;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            margin: 5px 0;
        }

            .sidebar a:hover {
                background: rgba(86, 165, 255, 0.1);
                color: #56a5ff;
                border-left-color: #56a5ff;
                padding-left: 30px;
            }

            .sidebar a.active {
                background: rgba(86, 165, 255, 0.15);
                color: #56a5ff;
                border-left-color: #56a5ff;
            }

        .menu-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        /* Top bar */
        .topbar {
            margin-left: 260px;
            padding: 20px 30px;
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(86, 165, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .logout {
            background: linear-gradient(135deg, #d9534f 0%, #c9302c 100%);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.3);
        }

            .logout:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(217, 83, 79, 0.4);
            }

        /* Content */
        .container {
            margin-left: 260px;
            padding: 30px;
            min-height: calc(100vh - 80px);
        }

        h2 {
            color: #56a5ff;
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Cards */
        .card {
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(86, 165, 255, 0.2);
            transition: all 0.3s ease;
        }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 40px rgba(86, 165, 255, 0.2);
                border-color: rgba(86, 165, 255, 0.4);
            }

            .card h3 {
                color: #56a5ff;
                margin-bottom: 20px;
                font-size: 20px;
            }

        /* Table */
        .table-container {
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(86, 165, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(86, 165, 255, 0.1);
        }

        th {
            background: rgba(86, 165, 255, 0.1);
            color: #56a5ff;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr {
            transition: all 0.2s ease;
        }

            tr:hover {
                background: rgba(86, 165, 255, 0.05);
            }

            tr:last-child td {
                border-bottom: none;
            }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #8b9dc3;
            font-size: 16px;
        }

        /* Form Elements */
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #56a5ff;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 20, 40, 0.6);
            border: 1.5px solid rgba(86, 165, 255, 0.3);
            color: #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

            input:focus {
                border-color: #56a5ff;
                background: rgba(15, 20, 40, 0.8);
                box-shadow: 0 0 20px rgba(86, 165, 255, 0.2);
            }

            input::placeholder {
                color: #5a6b8a;
            }

        button {
            margin-top: 20px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #56a5ff 0%, #3d7dc7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(86, 165, 255, 0.3);
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(86, 165, 255, 0.4);
                background: linear-gradient(135deg, #6bb5ff 0%, #4d8dd7 100%);
            }

            button:active {
                transform: translateY(0);
            }

        .btn-danger {
            background: linear-gradient(135deg, #d9534f 0%, #c9302c 100%);
            box-shadow: 0 6px 20px rgba(217, 83, 79, 0.3);
        }

            .btn-danger:hover {
                background: linear-gradient(135deg, #e96560 0%, #d9534f 100%);
                box-shadow: 0 8px 25px rgba(217, 83, 79, 0.4);
            }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 20, 40, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(86, 165, 255, 0.4);
            border-radius: 5px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(86, 165, 255, 0.6);
            }

        /* Animación de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container > * {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🏥 BIOMED</h2>
            <p class="sidebar-subtitle">Control de Equipos</p>
        </div>
        <div class="sidebar-menu">
            <a href="#" onclick="loadEquipos()" id="menu-equipos" class="active">
                <span class="menu-icon">📦</span> Equipos en Hospital
            </a>
            <a href="#" onclick="loadInventario()" id="menu-inventario">
                <span class="menu-icon">📋</span> Inventario
            </a>
            <a href="#" onclick="loadEntradas()" id="menu-entradas">
                <span class="menu-icon">➕</span> Registrar Entrada
            </a>
            <a href="#" onclick="loadSalidas()" id="menu-salidas">
                <span class="menu-icon">➖</span> Registrar Salida
            </a>
        </div>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <span class="topbar-title" id="userTitle">Dashboard</span>
        <button class="logout" onclick="logout()">🚪 Cerrar Sesión</button>
    </div>

    <!-- Content -->
    <div class="container">
        <h2 id="title">Equipos en Instalación</h2>
        <div id="content"></div>
    </div>

    <script>
        const token = localStorage.getItem("jwt");
        console.log("TOKEN EN DASHBOARD:", token);

        if (!token) {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("jwt");
            window.location.href = "login.html";
        }

        function setActiveMenu(menuId) {
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            document.getElementById(menuId).classList.add('active');
        }

        async function loadEquipos() {
            setActiveMenu('menu-equipos');
            document.getElementById("title").innerText = "Equipos Dentro del Hospital";

            try {
                console.log("🔍 Llamando a: http://localhost:8000/api/registry/en-instalacion");

                const response = await fetch("http://localhost:8000/api/registry/en-instalacion", {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    }
                });

                console.log("📡 Response status:", response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("❌ Error:", errorText);
                    document.getElementById("content").innerHTML =
                        `<div class="card"><p class='empty'>Error ${response.status}: No se pudo cargar la información</p></div>`;
                    return;
                }

                const data = await response.json();
                console.log("✅ Datos recibidos:", data);

                if (data.length === 0) {
                    document.getElementById("content").innerHTML =
                        "<div class='card'><p class='empty'>📭 No hay equipos dentro actualmente.</p></div>";
                    return;
                }

                let html = `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tipo de Equipo</th>
                                        <th>Serial</th>
                                        <th>Fecha de Entrada</th>
                                        <th>Usuario</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                data.forEach(eq => {
                    const fecha = new Date(eq.entryDate).toLocaleString('es-CO');
                    html += `
                            <tr>
                                <td><strong>#${eq.id}</strong></td>
                                <td>${eq.equipmentType}</td>
                                <td><code>${eq.serial}</code></td>
                                <td>${fecha}</td>
                                <td>${eq.loginUser || eq.entryUser}</td>
                            </tr>
                        `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                document.getElementById("content").innerHTML = html;

            } catch (error) {
                console.error("💥 Error de red:", error);
                document.getElementById("content").innerHTML =
                    "<div class='card'><p class='empty'>❌ Error de conexión. Verifica la consola.</p></div>";
            }
        }

        async function loadInventario() {
            setActiveMenu('menu-inventario');
            document.getElementById("title").innerText = "Inventario Completo";

            try {
                console.log("🔍 Llamando a: http://localhost:8000/api/equipos");

                const response = await fetch("http://localhost:8000/api/equipos", {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    }
                });

                console.log("📡 Response status:", response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("❌ Error:", errorText);
                    document.getElementById("content").innerHTML =
                        `<div class="card"><p class='empty'>Error ${response.status}: Error al cargar inventario</p></div>`;
                    return;
                }

                const data = await response.json();
                console.log("✅ Inventario recibido:", data);

                if (data.length === 0) {
                    document.getElementById("content").innerHTML =
                        "<div class='card'><p class='empty'>📭 No hay equipos en el inventario.</p></div>";
                    return;
                }

                let html = `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tipo de Equipo</th>
                                        <th>Serial</th>
                                        <th>Descripción</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                data.forEach(eq => {
                    html += `
                            <tr>
                                <td><strong>#${eq.id}</strong></td>
                                <td>${eq.equipmentType}</td>
                                <td><code>${eq.serial}</code></td>
                                <td>${eq.description || "Sin descripción"}</td>
                            </tr>
                        `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                document.getElementById("content").innerHTML = html;

            } catch (error) {
                console.error("💥 Error de red:", error);
                document.getElementById("content").innerHTML =
                    "<div class='card'><p class='empty'>❌ Error de conexión. Verifica la consola.</p></div>";
            }
        }

        function loadEntradas() {
            setActiveMenu('menu-entradas');
            document.getElementById("title").innerText = "Registrar Entrada de Equipo";

            document.getElementById("content").innerHTML = `
                    <div class="card">
                        <h3>➕ Nuevo Registro de Entrada</h3>
                        <label>Tipo de Equipo</label>
                        <input id="tipo" placeholder="Ej: Monitor de signos vitales">

                        <label>Serial</label>
                        <input id="serial" placeholder="Ej: SN-12345">

                        <label>Usuario Responsable</label>
                        <input id="usuario" placeholder="Ej: admin@hospital.com">

                        <button onclick="registrarEntrada()">✓ Registrar Entrada</button>
                    </div>
                `;
        }

        async function registrarEntrada() {
            const tipo = document.getElementById("tipo").value.trim();
            const serial = document.getElementById("serial").value.trim();
            const usuario = document.getElementById("usuario").value.trim();

            if (!tipo || !serial || !usuario) {
                alert("⚠️ Por favor completa todos los campos");
                return;
            }

            const entry = {
                EquipmentType: tipo,
                Serial: serial,
                LoginUser: usuario
            };

            console.log("📤 Enviando entrada:", entry);

            try {
                const res = await fetch("http://localhost:8000/api/registry/ingreso", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(entry)
                });

                console.log("📡 Response status:", res.status);

                if (res.ok) {
                    alert("✅ Entrada registrada exitosamente");
                    loadEquipos();
                } else {
                    const errorText = await res.text();
                    console.error("❌ Error:", errorText);
                    alert("❌ Error registrando entrada: " + errorText);
                }
            } catch (error) {
                console.error("💥 Error de red:", error);
                alert("❌ Error de conexión al registrar entrada");
            }
        }

        function loadSalidas() {
            setActiveMenu('menu-salidas');
            document.getElementById("title").innerText = "Registrar Salida de Equipo";

            document.getElementById("content").innerHTML = `
                    <div class="card">
                        <h3>➖ Registrar Salida de Equipo</h3>

                        <label>ID del Registro</label>
                        <input id="salidaId" type="number" placeholder="Ej: 1">

                        <label>Usuario Responsable</label>
                        <input id="salidaUser" placeholder="Ej: admin@hospital.com">

                        <button class="btn-danger" onclick="registrarSalida()">✓ Registrar Salida</button>
                    </div>
                `;
        }

        async function registrarSalida() {
            const id = document.getElementById("salidaId").value.trim();
            const user = document.getElementById("salidaUser").value.trim();

            if (!id || !user) {
                alert("⚠️ Por favor completa todos los campos");
                return;
            }

            console.log("📤 Registrando salida ID:", id);

            try {
                const res = await fetch(`http://localhost:8000/api/registry/egreso/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ OutUser: user })
                });

                console.log("📡 Response status:", res.status);

                if (res.ok) {
                    alert("✅ Salida registrada exitosamente");
                    loadEquipos();
                } else {
                    const errorText = await res.text();
                    console.error("❌ Error:", errorText);
                    alert("❌ Error: El registro no existe o ya está fuera.");
                }
            } catch (error) {
                console.error(" Error de red:", error);
                alert("Error de conexión al registrar salida");
            }
        }

        // Cargar equipos al entrar
        loadEquipos();
    </script>

</body>
</html>
